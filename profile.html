<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แก้ไขข้อมูลผู้ใช้ - CPE Open House</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase Cloud SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDxRlfiL80TUoeyQDk93PQ5A0W3e37PoSI",
            authDomain: "elon-musk-c6fa9.firebaseapp.com",
            projectId: "elon-musk-c6fa9",
            storageBucket: "elon-musk-c6fa9.firebasestorage.app",
            messagingSenderId: "609890115150",
            appId: "1:609890115150:web:428937710422523698ed1f",
            measurementId: "G-WTHXDEWJMR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. ดึงข้อมูลเดิมจาก localStorage มาเติมลงในฟอร์มเมื่อโหลดหน้า
        window.addEventListener("DOMContentLoaded", () => {
            const oldFirstName = localStorage.getItem("cpe_firstname") || "";
            const oldLastName = localStorage.getItem("cpe_lastname") || "";
            const oldSchool = localStorage.getItem("cpe_school") || "";

            document.getElementById("firstname").value = oldFirstName;
            document.getElementById("lastname").value = oldLastName;

            if (oldSchool) {
                const schoolTypes = ["โรงเรียน", "วิทยาลัย", "อื่นๆ"];
                let foundType = "";
                let detail = oldSchool;

                for (let type of schoolTypes) {
                    if (oldSchool.startsWith(type)) {
                        foundType = type;
                        detail = oldSchool.replace(type, "").trim();
                        break;
                    }
                }

                if (foundType) {
                    document.getElementById("school").value = foundType;
                    document.getElementById("school-detail").value = detail;
                } else {
                    document.getElementById("school").value = "อื่นๆ";
                    document.getElementById("school-detail").value = oldSchool;
                }
                toggleSchoolDetail();
            }
        });

        window.toggleSchoolDetail = function() {
            const schoolType = document.getElementById("school").value;
            const container = document.getElementById("school-detail-container");
            const input = document.getElementById("school-detail");
            const label = document.getElementById("school-detail-label");

            if (schoolType) {
                container.classList.remove("hidden");
                input.required = true;
                if (schoolType === "โรงเรียน") {
                    label.innerText = "ชื่อโรงเรียน";
                    input.placeholder = "กรอกชื่อโรงเรียน (ไม่ต้องใส่โรงเรียนนำหน้า)";
                } else if (schoolType === "วิทยาลัย") {
                    label.innerText = "ชื่อวิทยาลัย";
                    input.placeholder = "กรอกชื่อวิทยาลัย (ไม่ต้องใส่วิทยาลัยนำหน้า)";
                } else {
                    label.innerText = "ระบุสังกัด / สถานที่";
                    input.placeholder = "กรอกชื่อสังกัด หรือระบุ บุคคลทั่วไป...";
                }
            } else {
                container.classList.add("hidden");
                input.required = false;
            }
        };

        // 2. ฟังก์ชันอัปเดตข้อมูลลง LocalStorage และ Firebase Leaderboard
        window.handleUpdateProfile = async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById("submit-btn");
            submitBtn.disabled = true;
            submitBtn.innerText = "กำลังบันทึกข้อมูล...";

            // ดึงชื่อเดิมไว้สำหรับค้นหา Record ใน Cloud
            const oldFname = localStorage.getItem("cpe_firstname") || "";
            const oldLname = localStorage.getItem("cpe_lastname") || "";
            const oldFullName = `${oldFname} ${oldLname}`.trim();

            // ค่าใหม่จาก ฟอร์ม
            const fname = document.getElementById("firstname").value.trim();
            const lname = document.getElementById("lastname").value.trim();
            const schoolType = document.getElementById("school").value;
            const schoolDetail = document.getElementById("school-detail").value.trim();
            
            const newFullName = `${fname} ${lname}`.trim();
            const fullSchool = `${schoolType} ${schoolDetail}`.trim();

            try {
                // อัปเดตในคอลเลกชัน leaderboard บน Firebase Firestore
                if (oldFullName) {
                    const leaderboardRef = collection(db, "leaderboard");
                    const q = query(leaderboardRef, where("name", "==", oldFullName));
                    const querySnapshot = await getDocs(q);

                    if (!querySnapshot.empty) {
                        const batch = writeBatch(db);
                        querySnapshot.forEach((docSnap) => {
                            batch.update(docSnap.ref, {
                                name: newFullName,
                                school: fullSchool
                            });
                        });
                        await batch.commit();
                    }
                }

                // บันทึกค่าใหม่ลง localStorage
                localStorage.setItem("cpe_firstname", fname);
                localStorage.setItem("cpe_lastname", lname);
                localStorage.setItem("cpe_school", fullSchool);

                alert("✅ แก้ไขข้อมูลส่วนตัวเรียบร้อยแล้ว!");
                window.location.href = "index.html";
            } catch (error) {
                console.error("Update Error:", error);
                alert("❌ เกิดข้อผิดพลาดในการอัปเดตข้อมูล: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "บันทึกการเปลี่ยนแปลง 💾";
            }
        };
    </script>
</head>
<body class="font-sans bg-gradient-to-br from-orange-50 via-white to-amber-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border-t-8 border-orange-500 p-6 sm:p-8 relative overflow-hidden">
        <div class="text-center mb-6">
            <span class="text-xs font-bold tracking-widest text-orange-600 uppercase">CPE Open House</span>
            <h1 class="text-2xl sm:text-3xl font-black text-slate-800 mt-1">✏️ แก้ไขข้อมูลส่วนตัว</h1>
            <p class="text-xs text-slate-500 mt-1">แก้ไขชื่อ-นามสกุล หรือสังกัดโรงเรียนของคุณ</p>
        </div>

        <form onsubmit="handleUpdateProfile(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">ชื่อ</label>
                <input type="text" id="firstname" required placeholder="กรอกชื่อจริง..." 
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 text-sm bg-slate-50/50">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">นามสกุล</label>
                <input type="text" id="lastname" required placeholder="กรอกนามสกุล..." 
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 text-sm bg-slate-50/50">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">สังกัด</label>
                <select id="school" required onchange="toggleSchoolDetail()" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 text-sm bg-slate-50/50 text-slate-700 font-medium">
                    <option value="" disabled selected>-- เลือกประเภทสังกัด --</option>
                    <option value="โรงเรียน">โรงเรียน</option>
                    <option value="วิทยาลัย">วิทยาลัย</option>
                    <option value="อื่นๆ">อื่นๆ</option>
                </select>
            </div>

            <div id="school-detail-container" class="hidden">
                <label id="school-detail-label" class="block text-xs font-bold text-slate-700 mb-1">ระบุชื่อสังกัด</label>
                <input type="text" id="school-detail" placeholder="กรอกชื่อสังกัด..." 
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 text-sm bg-slate-50/50">
            </div>

            <button type="submit" id="submit-btn" 
                    class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl active:scale-95 transition-all text-sm mt-4">
                บันทึกการเปลี่ยนแปลง 💾
            </button>

            <a href="index.html" class="block text-center text-xs font-semibold text-slate-500 hover:text-slate-800 transition-colors pt-2">
                ยกเลิก / กลับหน้าหลัก
            </a>
        </form>
    </div>

</body>
</html>
